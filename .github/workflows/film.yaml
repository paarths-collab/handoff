name: Product film
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/film/**'
      - '.github/workflows/film.yaml'
permissions:
  contents: read
concurrency:
  group: film-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install headless Chrome libraries
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @handoff/film...
      - name: Render film
        run: pnpm --filter @handoff/film render
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-film
          path: apps/film/out/handoff-film.mp4
          if-no-files-found: error
