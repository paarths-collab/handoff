[package]
name = "tab-mover"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
dirs = "6"
tempfile = "3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
